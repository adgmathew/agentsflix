<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="auto" role="img" aria-label="AgentsFlix observability dashboard mockup showing spend, top models, and live request log">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>

  <!-- App frame -->
  <rect x="0" y="0" width="880" height="540" rx="14" fill="#0B0B0F"/>
  <!-- Window controls -->
  <g>
    <circle cx="22" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="42" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="62" cy="22" r="6" fill="#28C840"/>
    <rect x="320" y="12" width="240" height="20" rx="6" fill="#1A1A22"/>
    <text x="440" y="26" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#A8A296">app.agentsflix.com / overview</text>
  </g>

  <!-- Sidebar -->
  <rect x="0" y="44" width="160" height="496" fill="#101018"/>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#A8A296">
    <text x="20" y="76" fill="#fff" font-weight="700">AgentsFlix</text>
    <rect x="12" y="92" width="136" height="28" rx="6" fill="url(#gd)" opacity="0.18"/>
    <text x="24" y="110" fill="#fff">Overview</text>
    <text x="24" y="142">Requests</text>
    <text x="24" y="166">Models</text>
    <text x="24" y="190">Policies</text>
    <text x="24" y="214">Audit log</text>
    <text x="24" y="238">Teams</text>
    <text x="24" y="262">Budgets</text>
    <text x="24" y="286">Settings</text>
  </g>

  <!-- Header -->
  <g font-family="ui-monospace,monospace" fill="#fff">
    <text x="184" y="78" font-size="18" font-weight="700">Overview</text>
    <text x="184" y="96" font-size="11" fill="#A8A296">Last 30 days · acme corp</text>
  </g>

  <!-- KPI cards -->
  <g filter="url(#sh)">
    <rect x="184" y="116" width="160" height="78" rx="10" fill="#16161F"/>
    <text x="200" y="138" font-family="ui-monospace,monospace" font-size="11" fill="#A8A296">Total spend</text>
    <text x="200" y="166" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#fff">$48,210</text>
    <text x="200" y="184" font-family="ui-monospace,monospace" font-size="11" fill="#10B981">▼ 38% vs prev</text>
  </g>
  <g filter="url(#sh)">
    <rect x="356" y="116" width="160" height="78" rx="10" fill="#16161F"/>
    <text x="372" y="138" font-family="ui-monospace,monospace" font-size="11" fill="#A8A296">Requests</text>
    <text x="372" y="166" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#fff">2.41M</text>
    <text x="372" y="184" font-family="ui-monospace,monospace" font-size="11" fill="#F97316">▲ 12% growth</text>
  </g>
  <g filter="url(#sh)">
    <rect x="528" y="116" width="160" height="78" rx="10" fill="#16161F"/>
    <text x="544" y="138" font-family="ui-monospace,monospace" font-size="11" fill="#A8A296">Cache hit rate</text>
    <text x="544" y="166" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#fff">41.7%</text>
    <text x="544" y="184" font-family="ui-monospace,monospace" font-size="11" fill="#10B981">saved $19.4k</text>
  </g>
  <g filter="url(#sh)">
    <rect x="700" y="116" width="160" height="78" rx="10" fill="#16161F"/>
    <text x="716" y="138" font-family="ui-monospace,monospace" font-size="11" fill="#A8A296">Blocked prompts</text>
    <text x="716" y="166" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#fff">1,284</text>
    <text x="716" y="184" font-family="ui-monospace,monospace" font-size="11" fill="#FB7185">PII / policy</text>
  </g>

  <!-- Spend chart -->
  <g filter="url(#sh)">
    <rect x="184" y="208" width="504" height="220" rx="10" fill="#16161F"/>
    <text x="200" y="234" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#fff">Daily spend (USD)</text>
    <text x="200" y="250" font-family="ui-monospace,monospace" font-size="10" fill="#A8A296">Optimized · Unoptimized baseline</text>

    <!-- grid -->
    <g stroke="#22222C" stroke-width="1">
      <path d="M200 392 H672 M200 352 H672 M200 312 H672 M200 272 H672"/>
    </g>

    <!-- Unoptimized area (baseline higher) -->
    <path d="M200 282 L240 270 L280 286 L320 268 L360 260 L400 274 L440 256 L480 264 L520 252 L560 268 L600 250 L640 258 L672 246 L672 392 L200 392 Z"
          fill="url(#area2)"/>
    <path d="M200 282 L240 270 L280 286 L320 268 L360 260 L400 274 L440 256 L480 264 L520 252 L560 268 L600 250 L640 258 L672 246"
          stroke="#F97316" stroke-width="1.5" fill="none"/>

    <!-- Optimized area (lower) -->
    <path d="M200 354 L240 348 L280 360 L320 340 L360 330 L400 344 L440 324 L480 328 L520 318 L560 332 L600 314 L640 320 L672 308 L672 392 L200 392 Z"
          fill="url(#area)"/>
    <path d="M200 354 L240 348 L280 360 L320 340 L360 330 L400 344 L440 324 L480 328 L520 318 L560 332 L600 314 L640 320 L672 308"
          stroke="#7C3AED" stroke-width="1.8" fill="none"/>

    <!-- x labels -->
    <g font-family="ui-monospace,monospace" font-size="9" fill="#5C5648">
      <text x="200" y="408">May 1</text>
      <text x="320" y="408">May 8</text>
      <text x="440" y="408">May 15</text>
      <text x="560" y="408">May 22</text>
      <text x="660" y="408">May 30</text>
    </g>

    <!-- Legend -->
    <g font-family="ui-monospace,monospace" font-size="10">
      <rect x="540" y="222" width="10" height="10" fill="#7C3AED"/>
      <text x="556" y="231" fill="#A8A296">With AgentsFlix</text>
      <rect x="630" y="222" width="10" height="10" fill="#F97316"/>
      <text x="646" y="231" fill="#A8A296">Baseline</text>
    </g>
  </g>

  <!-- Top models -->
  <g filter="url(#sh)">
    <rect x="700" y="208" width="160" height="220" rx="10" fill="#16161F"/>
    <text x="716" y="234" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#fff">Top models</text>
    <g font-family="ui-monospace,monospace" font-size="11" fill="#fff">
      <text x="716" y="262">gpt-4o-mini</text>
      <rect x="716" y="268" width="128" height="6" rx="3" fill="#22222C"/>
      <rect x="716" y="268" width="118" height="6" rx="3" fill="url(#gd)"/>
      <text x="716" y="292">claude-sonnet</text>
      <rect x="716" y="298" width="128" height="6" rx="3" fill="#22222C"/>
      <rect x="716" y="298" width="74" height="6" rx="3" fill="url(#gd)"/>
      <text x="716" y="322">gemini-flash</text>
      <rect x="716" y="328" width="128" height="6" rx="3" fill="#22222C"/>
      <rect x="716" y="328" width="58" height="6" rx="3" fill="url(#gd)"/>
      <text x="716" y="352">claude-opus</text>
      <rect x="716" y="358" width="128" height="6" rx="3" fill="#22222C"/>
      <rect x="716" y="358" width="32" height="6" rx="3" fill="url(#gd)"/>
      <text x="716" y="382">llama-3.1-70b</text>
      <rect x="716" y="388" width="128" height="6" rx="3" fill="#22222C"/>
      <rect x="716" y="388" width="22" height="6" rx="3" fill="url(#gd)"/>
    </g>
  </g>

  <!-- Live request log -->
  <g filter="url(#sh)">
    <rect x="184" y="444" width="676" height="80" rx="10" fill="#16161F"/>
    <text x="200" y="466" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#fff">Live requests</text>
    <g font-family="ui-monospace,monospace" font-size="11" fill="#A8A296">
      <text x="200" y="488">14:02:11  marketing  gpt-4o-mini  →  cache hit       $0.000</text>
      <text x="200" y="504">14:02:11  support    claude-sonnet  →  routed         $0.012</text>
      <text x="200" y="520">14:02:12  legal      gpt-4o         →  blocked: PII   —</text>

      <circle cx="190" cy="484" r="3" fill="#10B981"/>
      <circle cx="190" cy="500" r="3" fill="#7C3AED"/>
      <circle cx="190" cy="516" r="3" fill="#FB7185"/>
    </g>
  </g>
</svg>
