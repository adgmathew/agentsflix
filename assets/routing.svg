<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="auto" role="img" aria-label="Animated diagram showing AgentsFlix routing AI requests to the cheapest capable model in real time">
  <defs>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/></filter>
  </defs>

  <rect x="0" y="0" width="720" height="320" fill="#FBF8F2"/>

  <!-- Client -->
  <g filter="url(#sh)">
    <rect x="30" y="130" width="130" height="60" rx="10" fill="#fff" stroke="#0B0B0F"/>
    <text x="95" y="156" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#0B0B0F">Your app</text>
    <text x="95" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5C5648">POST /v1/chat</text>
  </g>

  <!-- Gateway -->
  <g filter="url(#sh)">
    <rect x="260" y="110" width="200" height="100" rx="14" fill="#0B0B0F"/>
    <rect x="260" y="110" width="200" height="32" rx="14" fill="url(#grad2)"/>
    <text x="360" y="131" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#fff">AgentsFlix Gateway</text>
    <text x="360" y="170" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#F5F0E8">classify · score · route</text>
    <text x="360" y="190" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#A8A296">cache hit? policy ok? PII?</text>
  </g>

  <!-- Providers -->
  <g font-family="ui-monospace,monospace" font-size="11" fill="#0B0B0F">
    <g filter="url(#sh)">
      <rect x="560" y="40" width="140" height="50" rx="10" fill="#fff" stroke="#0B0B0F"/>
      <text x="630" y="60" text-anchor="middle" font-weight="700">OpenAI</text>
      <text x="630" y="76" text-anchor="middle" fill="#5C5648">gpt-4o-mini · $0.15/M</text>
    </g>
    <g filter="url(#sh)">
      <rect x="560" y="135" width="140" height="50" rx="10" fill="#fff" stroke="#0B0B0F"/>
      <text x="630" y="155" text-anchor="middle" font-weight="700">Anthropic</text>
      <text x="630" y="171" text-anchor="middle" fill="#5C5648">Claude Sonnet · $3/M</text>
    </g>
    <g filter="url(#sh)">
      <rect x="560" y="230" width="140" height="50" rx="10" fill="#fff" stroke="#0B0B0F"/>
      <text x="630" y="250" text-anchor="middle" font-weight="700">Google</text>
      <text x="630" y="266" text-anchor="middle" fill="#5C5648">Gemini Flash · $0.10/M</text>
    </g>
  </g>

  <!-- Animated traveling dot client -> gateway -->
  <path id="p1" d="M160 160 H260" stroke="#0B0B0F" stroke-width="1.4" fill="none"/>
  <circle r="5" fill="#7C3AED">
    <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto" keyTimes="0;0.28;1" keyPoints="0;1;1">
      <mpath href="#p1"/>
    </animateMotion>
  </circle>

  <!-- Three possible paths gateway -> providers; only one is "active" at a time, cycling -->
  <path id="pA" d="M460 140 C 510 120, 520 70, 560 65" stroke="#0B0B0F" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
  <path id="pB" d="M460 160 H560" stroke="#0B0B0F" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
  <path id="pC" d="M460 180 C 510 200, 520 250, 560 255" stroke="#0B0B0F" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>

  <!-- Active highlight cycling through pA -> pC -> pA -->
  <circle r="6" fill="#F97316">
    <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto" keyTimes="0;0.28;0.6;1" keyPoints="0;0;1;1">
      <mpath href="#pA"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="3.6s" repeatCount="indefinite" keyTimes="0;0.28;0.32;0.58;0.6"/>
  </circle>

  <!-- Labels -->
  <g font-family="ui-monospace,monospace" font-size="10" fill="#5C5648">
    <text x="200" y="152" text-anchor="middle">request</text>
    <text x="510" y="100" text-anchor="middle">route to cheapest capable</text>
    <text x="510" y="305" text-anchor="middle">fallback if rate-limited</text>
  </g>

  <!-- Decision badge -->
  <g>
    <rect x="280" y="232" width="160" height="22" rx="11" fill="#10B981" opacity="0.15"/>
    <text x="360" y="247" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#047857">cache hit — 0 tokens used</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="3.6s" repeatCount="indefinite" keyTimes="0;0.62;0.64;0.9;0.92;1"/>
  </g>
</svg>
