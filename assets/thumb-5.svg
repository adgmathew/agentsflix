<svg viewBox="0 0 270 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="barrel" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#E50914" stop-opacity="0.1"/>
      <stop offset="90%" stop-color="#E50914" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="270" height="480" fill="#030508"/>

  <!-- Gun barrel rings -->
  <circle cx="135" cy="200" r="100" fill="none" stroke="#E50914" stroke-width="0.5" opacity="0.5"/>
  <circle cx="135" cy="200" r="120" fill="none" stroke="#E50914" stroke-width="0.5" opacity="0.3"/>
  <circle cx="135" cy="200" r="140" fill="none" stroke="#E50914" stroke-width="0.5" opacity="0.1"/>

  <!-- Focal Blast -->
  <circle cx="135" cy="200" r="80" fill="url(#barrel)"/>

  <!-- Palace Archway Silhouette -->
  <path d="M40 480V150c0-50 40-90 95-90s95 40 95 90v330h-30V150c0-30-30-60-65-60s-65 30-65 60v330H40z" fill="#000"/>

  <!-- Leaping Bond-style Silhouette -->
  <path d="M120 220c0 0 5-10 15-10s15 10 15 10v20l15 30-20 5-10-25-10 25-20-5 15-30V220z" fill="#000" transform="translate(0,-20) rotate(-15 135 240)"/>
  <path d="M135 210c3 0 5-2 5-5s-2-5-5-5-5 2-5 5 2 5 5 5z" fill="#000" transform="translate(0,-20) rotate(-15 135 240)"/>

  <!-- Title Text -->
  <g filter="url(#glow)">
    <text x="135" y="380" font-family="Inter, sans-serif" font-weight="900" font-size="32" fill="#fff" text-anchor="middle" letter-spacing="2">ROYAL</text>
    <text x="135" y="420" font-family="Inter, sans-serif" font-weight="900" font-size="32" fill="#E50914" text-anchor="middle" letter-spacing="4">ESCAPE</text>
  </g>

  <!-- Action Line -->
  <path d="M20 395h230" stroke="#E50914" stroke-width="1" opacity="0.5"/>
</svg>