      <stop offset="0%" style="stop-color:#b20710"/>
      <stop offset="100%" style="stop-color:#E50914"/>
    </linearGradient>
    <linearGradient id="t5Overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
