  <path d="M230 300 L240 200 L250 300" fill="none" stroke="#E50914" stroke-width="3" opacity="0.6"/>

  <!-- Crown -->
  <path d="M190 220 L195 180 L200 220 L205 180 L210 220" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.8"/>

  <!-- Title -->
  <text x="200" y="480" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" font-family="system-ui">ROYAL</text>
  <text x="200" y="520" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" font-family="system-ui">ESCAPE</text>

  <!-- Genre tag -->
  <rect x="200" y="560" width="110" height="26" rx="13" fill="rgba(229,9,20,0.3)"/>
  <text x="255" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="#E50914" font-family="system-ui">HISTORICAL</text>

