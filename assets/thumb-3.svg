<svg viewBox="0 0 400 711" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="t3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#2b2d42"/>
    </linearGradient>
    <linearGradient id="t3Overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="711" fill="url(#t3Bg)"/>
  <rect width="400" height="711" fill="url(#t3Overlay)"/>

  <!-- Fantasy dragon silhouette -->
  <path d="M200 100 Q250 150 200 200 Q250 250 200 300 Q150 250 200 200 Q150 150 200 100" fill="#533483" opacity="0.5"/>
  <path d="M200 100 Q250 150 200 200 Q250 250 200 300 Q150 250 200 200 Q150 150 200 100" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>

  <!-- Crown -->
  <path d="M180 250 L190 200 L200 250 L210 200 L220 250" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.7"/>

  <!-- Title -->
  <text x="200" y="480" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" font-family="system-ui">DRAGON'S</text>
  <text x="200" y="520" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" font-family="system-ui">HEIR</text>

  <!-- Genre tag -->
  <rect x="200" y="560" width="90" height="26" rx="13" fill="rgba(229,9,20,0.3)"/>
  <text x="245" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="#E50914" font-family="system-ui">FANTASY</text>

  <!-- Stats -->
  <text x="200" y="620" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="system-ui">6.2M views</text>
  <text x="200" y="650" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.7)" font-family="system-ui">⭐ 4.9 • 32 episodes</text>

  <!-- Play button -->
  <circle cx="200" cy="355" r="40" fill="#E50914" opacity="0.9"/>
  <path d="M185 340 L215 355 L185 370 Z" fill="#fff"/>

  <!-- Duration -->
  <rect x="300" y="650" width="80" height="28" rx="4" fill="rgba(0,0,0,0.8)"/>
  <text x="340" y="670" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="system-ui">9:30</text>

  <!-- Badge -->
  <rect x="16" y="16" width="80" height="26" rx="13" fill="#E50914"/>
  <text x="56" y="34" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="system-ui">#3</text>

  <!-- Progress -->
  <rect x="0" y="707" width="400" height="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="0" y="707" width="312" height="4" fill="#E50914"/>
</svg>